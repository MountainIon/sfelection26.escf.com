name: Update endorsement data

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours (UTC)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Rebuild from sources
        run: python scripts/build.py --report build/report.md

      - name: Open or update pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: auto/data-update
          delete-branch: true
          title: "Endorsement data update"
          commit-message: "Update endorsement data from sources"
          body-path: build/report.md
          add-paths: |
            site/index.html
            data/snapshot.json
            assets/logos/*
          labels: data-update
